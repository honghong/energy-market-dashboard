name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: energy
          POSTGRES_DB: energy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U energy" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit and API tests
        run: pytest
      - name: Pipeline smoke test against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://energy:energy@localhost:5432/energy
        run: |
          python -m app.pipeline --source sample
          python -m app.pipeline --source sample   # second run is incremental

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and compile Bicep
        run: |
          az bicep install
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --stdout > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, infra]
    steps:
      - uses: actions/checkout@v4
      - name: Single-container image (Azure)
        run: docker build -t energy-dashboard .
      - name: Compose stack
        run: docker compose build
