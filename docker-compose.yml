# docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
      POSTGRES_DB: energy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://energy:energy@db:5432/energy
      EIA_API_KEY: ${EIA_API_KEY:-}
      HISTORY_START: ${HISTORY_START:-2019-01-01}
      # Load on startup, then refresh every 6 hours.
      INGEST_INTERVAL_MINUTES: ${INGEST_INTERVAL_MINUTES:-360}
      PIPELINE_TOKEN: ${PIPELINE_TOKEN:-}
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
