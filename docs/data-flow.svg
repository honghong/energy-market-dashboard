<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="Data flow: EIA API prices are ingested incrementally by a scheduled Python job, upserted into PostgreSQL, analyzed with Pandas in FastAPI, and shown in the React dashboard."><style>
  .bg{fill:#ffffff}
  .t{fill:#1f2328;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .m{fill:#59636e}
  .ttl{font-size:20px;font-weight:700}
  .sub{font-size:12.5px}
  .bt{font-size:13px;font-weight:650}
  .bl{font-size:11.5px}
  .al{font-size:11px}
  .stage{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;fill:#2a78d6}
  .zl{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;fill:#59636e}
  .box{fill:#ffffff;stroke:#d0d7de;stroke-width:1.2}
  .acc{fill:#eef4fc;stroke:#2a78d6;stroke-width:1.5}
  .zone{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2;stroke-dasharray:6 4}
  .zone2{fill:#eef4fc;fill-opacity:.45;stroke:#2a78d6;stroke-width:1.2;stroke-dasharray:6 4}
  .ln{fill:none;stroke:#6e7781;stroke-width:1.6}
  .head{fill:#6e7781}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .t{fill:#e6edf3} .m{fill:#9198a1} .stage{fill:#4493f8} .zl{fill:#9198a1}
    .box{fill:#151b23;stroke:#3d444d}
    .acc{fill:#132339;stroke:#4493f8}
    .zone{fill:#10151c;stroke:#3d444d}
    .zone2{fill:#132339;fill-opacity:.5;stroke:#4493f8}
    .ln{stroke:#8b949e} .head{fill:#8b949e}
  }
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1280" height="470" rx="14" class="bg"/><text x="28" y="40" class="t ttl" text-anchor="start">Energy Market Dashboard — data flow</text><text x="28" y="62" class="t m sub" text-anchor="start">How a daily price moves from the EIA API to the dashboard</text><text x="28" y="100" class="stage" text-anchor="start">1 · SOURCE</text><rect x="28" y="112" width="184" height="170" rx="9" class="box"/><text x="42" y="136" class="t bt" text-anchor="start">EIA Open Data API v2</text><text x="42" y="157" class="t m bl" text-anchor="start">WTI, Brent (spot)</text><text x="42" y="175" class="t m bl" text-anchor="start">Henry Hub natural gas</text><text x="42" y="193" class="t m bl" text-anchor="start">NY Harbor RBOB, ULSD</text><text x="42" y="211" class="t m bl" text-anchor="start">daily prices</text><text x="42" y="229" class="t m bl" text-anchor="start">recent days get revised</text><text x="288" y="100" class="stage" text-anchor="start">2 · INGEST</text><rect x="288" y="112" width="184" height="170" rx="9" class="acc"/><text x="302" y="136" class="t bt" text-anchor="start">Ingest job (Python)</text><text x="302" y="157" class="t m bl" text-anchor="start">Container Apps Job</text><text x="302" y="175" class="t m bl" text-anchor="start">weekdays 22:30 UTC</text><text x="302" y="193" class="t m bl" text-anchor="start">httpx, 5,000 rows/page</text><text x="302" y="211" class="t m bl" text-anchor="start">retry on 429 / 5xx</text><text x="302" y="229" class="t m bl" text-anchor="start">window: last date − 10d</text><text x="302" y="247" class="t m bl" text-anchor="start">1 transaction per series</text><text x="548" y="100" class="stage" text-anchor="start">3 · STORE</text><rect x="548" y="112" width="184" height="170" rx="9" class="box"/><text x="562" y="136" class="t bt" text-anchor="start">PostgreSQL 16</text><text x="562" y="157" class="t m bl" text-anchor="start">price_observations</text><text x="562" y="175" class="t m bl" text-anchor="start">unique (series, date)</text><text x="562" y="193" class="t m bl" text-anchor="start">INSERT … ON CONFLICT</text><text x="562" y="211" class="t m bl" text-anchor="start">DO UPDATE on revision</text><text x="562" y="229" class="t m bl" text-anchor="start">ingest_runs (audit log)</text><text x="808" y="100" class="stage" text-anchor="start">4 · ANALYZE</text><rect x="808" y="112" width="184" height="170" rx="9" class="acc"/><text x="822" y="136" class="t bt" text-anchor="start">FastAPI + Pandas</text><text x="822" y="157" class="t m bl" text-anchor="start">window + 120d warm-up</text><text x="822" y="175" class="t m bl" text-anchor="start">20 / 50-day averages</text><text x="822" y="193" class="t m bl" text-anchor="start">20-day annualized vol</text><text x="822" y="211" class="t m bl" text-anchor="start">52-week range, YTD</text><text x="822" y="229" class="t m bl" text-anchor="start">Brent–WTI, 3-2-1 crack</text><text x="822" y="247" class="t m bl" text-anchor="start">60-day z-score</text><text x="1068" y="100" class="stage" text-anchor="start">5 · PRESENT</text><rect x="1068" y="112" width="184" height="170" rx="9" class="box"/><text x="1082" y="136" class="t bt" text-anchor="start">React dashboard</text><text x="1082" y="157" class="t m bl" text-anchor="start">price tiles</text><text x="1082" y="175" class="t m bl" text-anchor="start">price + average chart</text><text x="1082" y="193" class="t m bl" text-anchor="start">spread chart, z badge</text><text x="1082" y="211" class="t m bl" text-anchor="start">pipeline run status</text><text x="1082" y="229" class="t m bl" text-anchor="start">table view</text><polyline points="212,197 286,197" class="ln" marker-end="url(#a)"/><text x="250.0" y="189" class="t m al" text-anchor="middle">HTTPS GET</text><text x="250.0" y="213" class="t m al" text-anchor="middle">JSON pages</text><polyline points="472,197 546,197" class="ln" marker-end="url(#a)"/><text x="510.0" y="189" class="t m al" text-anchor="middle">upsert</text><text x="510.0" y="213" class="t m al" text-anchor="middle">rows</text><polyline points="732,197 806,197" class="ln" marker-end="url(#a)"/><text x="770.0" y="189" class="t m al" text-anchor="middle">SELECT</text><text x="770.0" y="213" class="t m al" text-anchor="middle">window</text><polyline points="992,197 1066,197" class="ln" marker-end="url(#a)"/><text x="1030.0" y="189" class="t m al" text-anchor="middle">REST</text><text x="1030.0" y="213" class="t m al" text-anchor="middle">JSON</text><polyline points="640,282 640,322 1160,322 1160,284" class="ln" marker-end="url(#a)"/><text x="900" y="314" class="t m al" text-anchor="middle">ingest_runs → /api/pipeline/runs → pipeline status panel</text><text x="28" y="372" class="t m bl" text-anchor="start">•  Idempotent: re-running a day overwrites revised values instead of duplicating rows.</text><text x="28" y="396" class="t m bl" text-anchor="start">•  Failure isolation: if one series fails, the run is marked partial and the others still load.</text><text x="28" y="420" class="t m bl" text-anchor="start">•  Sample mode: with no EIA key, a simulator replaces the API and the UI labels the data as simulated.</text></svg>