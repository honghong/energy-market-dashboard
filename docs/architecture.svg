<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 812" width="1280" height="812" role="img" aria-label="System architecture: GitHub Actions deploys with OIDC and Bicep to an Azure resource group containing a Container App, a scheduled Container Apps Job, PostgreSQL, Key Vault, Container Registry and a managed identity."><style>
