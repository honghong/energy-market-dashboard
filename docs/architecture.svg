</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1280" height="812" rx="14" class="bg"/><text x="28" y="40" class="t ttl" text-anchor="start">Energy Market Dashboard — system architecture</text><text x="28" y="62" class="t m sub" text-anchor="start">Azure Container Apps deployment, built and released by GitHub Actions</text><rect x="730" y="82" width="200" height="52" rx="9" class="box"/><text x="744" y="106" class="t bt" text-anchor="start">Visitor's browser</text><text x="744" y="127" class="t m bl" text-anchor="start">dashboard + JSON API</text><rect x="24" y="164" width="272" height="432" rx="12" class="zone"/><text x="38" y="184" class="zl" text-anchor="start">GITHUB</text><rect x="44" y="200" width="232" height="64" rx="9" class="box"/><text x="58" y="224" class="t bt" text-anchor="start">Repository</text><text x="58" y="245" class="t m bl" text-anchor="start">honghong/energy-market-dashboard</text><rect x="44" y="300" width="232" height="112" rx="9" class="box"/><text x="58" y="324" class="t bt" text-anchor="start">CI workflow</text><text x="58" y="345" class="t m bl" text-anchor="start">ruff, pytest, PostgreSQL smoke</text><text x="58" y="363" class="t m bl" text-anchor="start">TypeScript check, Vitest</text><text x="58" y="381" class="t m bl" text-anchor="start">Bicep lint, Docker builds</text><rect x="44" y="448" width="232" height="112" rx="9" class="box"/><text x="58" y="472" class="t bt" text-anchor="start">Deploy workflow</text><text x="58" y="493" class="t m bl" text-anchor="start">after green CI or manual run</text><text x="58" y="511" class="t m bl" text-anchor="start">OIDC login, no stored keys</text><text x="58" y="529" class="t m bl" text-anchor="start">infra → push → apps → test</text><polyline points="160,264 160,298" class="ln" marker-end="url(#a)"/><text x="168" y="286" class="t m al" text-anchor="start">push</text><polyline points="160,412 160,446" class="ln" marker-end="url(#a)"/><text x="168" y="434" class="t m al" text-anchor="start">on success</text><rect x="320" y="164" width="936" height="520" rx="12" class="zone"/><text x="334" y="184" class="zl" text-anchor="start">AZURE · RESOURCE GROUP RG-ENERGY-DASH-CUS · CENTRALUS</text><rect x="410" y="200" width="200" height="64" rx="9" class="box"/><text x="424" y="224" class="t bt" text-anchor="start">Microsoft Entra ID</text><text x="424" y="245" class="t m bl" text-anchor="start">federated credential</text><rect x="410" y="300" width="200" height="64" rx="9" class="box"/><text x="424" y="324" class="t bt" text-anchor="start">Resource Manager</text><text x="424" y="345" class="t m bl" text-anchor="start">infra/main.bicep, 2 passes</text><rect x="410" y="400" width="200" height="64" rx="9" class="box"/><text x="424" y="424" class="t bt" text-anchor="start">Container Registry</text><text x="424" y="445" class="t m bl" text-anchor="start">energy-dashboard:&lt;sha&gt;</text><rect x="410" y="540" width="200" height="92" rx="9" class="box"/><text x="424" y="564" class="t bt" text-anchor="start">Managed identity</text><text x="424" y="585" class="t m bl" text-anchor="start">user-assigned; used by</text><text x="424" y="603" class="t m bl" text-anchor="start">web app and job</text><polyline points="276,504 300,504 300,232" class="ln"/><polyline points="300,232 408,232" class="ln" marker-end="url(#a)"/><text x="312" y="225" class="t m al" text-anchor="start">OIDC token</text><polyline points="300,332 408,332" class="ln" marker-end="url(#a)"/><text x="312" y="325" class="t m al" text-anchor="start">Bicep deploy</text><polyline points="300,432 408,432" class="ln" marker-end="url(#a)"/><text x="312" y="425" class="t m al" text-anchor="start">docker push</text><polyline points="510,540 510,466" class="ln" marker-end="url(#a)"/><text x="518" y="508" class="t m al" text-anchor="start">AcrPull</text><rect x="660" y="200" width="340" height="452" rx="12" class="zone2"/><text x="674" y="220" class="zl" text-anchor="start">CONTAINER APPS ENVIRONMENT</text><rect x="685" y="236" width="290" height="120" rx="9" class="acc"/><text x="699" y="260" class="t bt" text-anchor="start">Container App · emd-web</text><text x="699" y="281" class="t m bl" text-anchor="start">FastAPI API + React build</text><text x="699" y="299" class="t m bl" text-anchor="start">HTTPS ingress, scales 0–1</text><text x="699" y="317" class="t m bl" text-anchor="start">health probes /api/health</text><rect x="685" y="420" width="290" height="112" rx="9" class="acc"/><text x="699" y="444" class="t bt" text-anchor="start">Container Apps Job · emd-ingest</text><text x="699" y="465" class="t m bl" text-anchor="start">python -m app.pipeline</text><text x="699" y="483" class="t m bl" text-anchor="start">cron 30 22 * * 1-5 (UTC)</text><polyline points="830,134 830,234" class="ln" marker-end="url(#a)"/><text x="838" y="190" class="t m al" text-anchor="start">HTTPS</text><polyline points="610,432 658,432" class="ln" marker-end="url(#a)"/><text x="634" y="424" class="t m al" text-anchor="middle">pull</text><polyline points="610,586 658,586" class="ln" marker-end="url(#a)"/><text x="634" y="578" class="t m al" text-anchor="middle">used by</text><rect x="1050" y="200" width="190" height="90" rx="9" class="box"/><text x="1064" y="224" class="t bt" text-anchor="start">Key Vault</text><text x="1064" y="245" class="t m bl" text-anchor="start">database-url</text><text x="1064" y="263" class="t m bl" text-anchor="start">eia-api-key</text><rect x="1050" y="330" width="190" height="110" rx="9" class="box"/><text x="1064" y="354" class="t bt" text-anchor="start">PostgreSQL Flexible</text><text x="1064" y="375" class="t m bl" text-anchor="start">version 16</text><text x="1064" y="393" class="t m bl" text-anchor="start">Burstable B1ms</text><text x="1064" y="411" class="t m bl" text-anchor="start">TLS required</text><rect x="1050" y="480" width="190" height="72" rx="9" class="box"/><text x="1064" y="504" class="t bt" text-anchor="start">Log Analytics</text><text x="1064" y="525" class="t m bl" text-anchor="start">container logs, 30 days</text><polyline points="1000,245 1048,245" class="ln" marker-end="url(#a)"/><text x="1024" y="237" class="t m al" text-anchor="middle">secrets</text><polyline points="975,350 1048,350" class="ln" marker-end="url(#a)"/><text x="1012" y="342" class="t m al" text-anchor="middle">SQL / TLS</text><polyline points="975,430 1048,430" class="ln" marker-end="url(#a)"/><text x="1012" y="422" class="t m al" text-anchor="middle">upsert</text><polyline points="1000,516 1048,516" class="ln" marker-end="url(#a)"/><text x="1024" y="508" class="t m al" text-anchor="middle">logs</text><rect x="730" y="730" width="200" height="52" rx="9" class="box"/><text x="744" y="754" class="t bt" text-anchor="start">EIA Open Data API</text><text x="744" y="775" class="t m bl" text-anchor="start">api.eia.gov, v2</text><polyline points="830,532 830,728" class="ln" marker-end="url(#a)"/><text x="838" y="712" class="t m al" text-anchor="start">HTTPS GET daily prices</text></svg>